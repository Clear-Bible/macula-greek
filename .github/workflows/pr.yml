name: Pull Request Actions
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# Actions are pinned to commit SHAs rather than tags: a tag such as `v7` is
# mutable and can be repointed at new code by the action's owner. The trailing
# comment records the human-readable release each SHA belongs to.
jobs:
  # Poetry and dependencies are cached to improve performance.
  # Caching cribbed from https://jacobian.org/til/github-actions-poetry/
  #
  # Note that the poetry cache key below embeds the Poetry version: it restores
  # ~/.local, so leaving the key unchanged across an upgrade would silently
  # bring back the previous Poetry binary.
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: cache poetry installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local
          key: poetry-2.5.1
      - name: install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: cache dependencies
        id: cache-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./test/.venv
          # Scoped to this project's lock so a pipeline re-lock does not evict
          # it, and keyed by Python version so a venv built against a different
          # interpreter is never restored.
          key: pydeps-py3.14-${{ hashFiles('test/poetry.lock') }}
      - name: install dependencies
        run: poetry install --no-interaction
        working-directory: ./test
        if: steps.cache-deps.outputs.cache-hit != 'true'
      - name: execute pytest
        working-directory: ./test
        # `tee` obscures exit code.
        # `-o pipefail` forces an early fail.
        run: set -o pipefail; poetry run pytest | tee output.log
      - name: Archive test run output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-run-output
          path: ./test/output.log
          retention-days: 8

  # The pipelines are not run here — that would overwrite tracked data files.
  # This only proves each pyproject is valid, its lock is current, and the
  # dependencies still resolve and install on the supported Python.
  Check-Pipelines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - pipelines/lowfat-transform
          - pipelines/tei-transform
    steps:
      # No `lfs: true` here: this job never reads the data files, and the LFS
      # fetch is the slowest step in the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 2.5.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: validate pyproject and lock
        run: poetry check --lock --strict
        working-directory: ${{ matrix.pipeline }}
      - name: install dependencies
        run: poetry install --no-interaction
        working-directory: ${{ matrix.pipeline }}
